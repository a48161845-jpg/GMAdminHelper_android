<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GM Admin Helper</title>
<style>
:root{--bg:#0d1016;--card:#151a23;--el:#1e2530;--el2:#2a3342;--tx:#eef1f6;--mu:#8d97a8;--bd:#252d3b;--ac:#5eead4;--acb:#0f766e;--ok:#34d399;--er:#f0616d;--wr:#f5b84b;--pk:#b4506a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{flex:none;padding:14px 16px 10px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#141b2c,var(--bg))}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5f7df0,#8a63e6);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;box-shadow:0 4px 14px #5f7df044}
header b{font-size:18px;display:block}header small{color:var(--mu);font-size:12.5px}
#lv{margin-left:auto;background:var(--el);border-radius:12px;padding:5px 11px;font-size:13px;color:var(--ac);font-weight:600}
main{flex:1;overflow-y:auto;padding:4px 12px 90px;-webkit-overflow-scrolling:touch}
nav{flex:none;position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#0f1420ee;backdrop-filter:blur(10px);border-top:1px solid var(--bd);z-index:20}
nav button{flex:1;background:transparent;border:0;border-radius:14px;padding:12px 2px;color:var(--mu);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{background:var(--el2);color:var(--tx);font-weight:600}
button{font:inherit;color:var(--tx);cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu)}.sm{font-size:12.5px}.hid{display:none!important}
.lbl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.b{background:var(--el);border:0;border-radius:12px;padding:11px 15px;margin:0 6px 6px 0;min-height:44px;transition:transform .08s,filter .08s}.b:active{transform:scale(.97);filter:brightness(1.25)}
.b.sm{min-height:34px;padding:6px 11px;font-size:13.5px}
.pri{background:var(--acb)!important;color:#f2f5ff!important;font-weight:600}.no{background:#7a2f37!important;color:#fff!important}.ok{background:#1f6b4a!important;color:#fff!important}
.ghost{background:transparent!important;border:1px solid var(--bd)!important;color:var(--mu)!important}
.wide{display:block;width:100%;text-align:left;margin-right:0}
.c{background:var(--el);border:0;border-radius:18px;padding:8px 14px;margin:0 6px 7px 0;font-size:14px}.c.on{background:var(--acb);color:#f2f5ff}
.chips{display:flex;flex-wrap:wrap;margin-bottom:4px}
.chipsx{display:flex;overflow-x:auto;gap:0;padding-bottom:4px;scrollbar-width:none}.chipsx::-webkit-scrollbar{display:none}.chipsx .c{flex:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;width:100%;outline:0;margin-bottom:8px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}input[type=checkbox]{width:20px;height:20px;margin:0 10px 0 0;accent-color:#5f7df0}input[type=range]{padding:0;accent-color:#7c9cff}
textarea{resize:vertical;line-height:1.4}
label.k{display:flex;align-items:center;margin:9px 0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:10px;background:var(--bg);color:var(--mu);white-space:nowrap}
.tag.mute,.tag.rmute{color:#e0a23b}.tag.jail{color:#e2915f}.tag.ban,.tag.sban{color:#e0677a}.tag.warn{color:#8fb4f0}.tag.g{color:#5fd0a0}.tag.a{color:var(--ac)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:12px;padding:11px;font:12px ui-monospace,Consolas,monospace;color:#b9bfd0;margin:8px 0;max-height:240px;overflow:auto}
.ib{width:36px;height:36px;border-radius:11px;border:0;background:var(--el);color:var(--tx);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.ib:active{background:var(--el2)}.ib.on{background:var(--acb)}.ib.red{background:#5a2830}
/* главная */
.step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.step:last-of-type{border:0}
.st{width:26px;height:26px;border-radius:50%;background:var(--el);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:var(--mu)}.st.ok{background:#1f6b4a;color:#fff}
.step .t{flex:1;min-width:0}.step .t b{font-weight:600;display:block}.step .t small{color:var(--mu);font-size:12.5px}
.hero{display:flex;gap:8px}.hero .b{flex:1;margin:0;text-align:center;padding:14px 8px}
.kp{display:flex;gap:8px;margin-bottom:10px}.kp>div{flex:1;background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}.kp .n{font-size:26px;font-weight:700;line-height:1.1}
.wk{display:flex;gap:6px;align-items:flex-end;height:70px}
.wk>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}.wk .bar{width:70%;border-radius:5px;background:var(--acb);min-height:3px}.wk small{font-size:11px;color:var(--mu)}
/* правила и списки */
.rule{padding:0;overflow:hidden}.rh{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px}.rh .rt{flex:1;min-width:0}.rh .rt b{display:block;font-size:15.5px}
.rt .meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.pt{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 8px 9px 14px;border-top:1px solid var(--bd)}.pt .pn{min-width:34px;color:var(--ac);font-weight:700;font-size:14px}.acts{display:flex;gap:5px;margin-left:auto}
.pt .nm{flex:1 1 120px;min-width:0}.pt .nm small{display:block;color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa{border-top:1px dashed var(--bd);padding:12px 12px 6px;background:#0f1522}.qa .grid{display:grid;grid-template-columns:70px 1fr;gap:8px}
.qa .g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.cr{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;border-top:1px solid var(--bd)}.cr:first-child{border-top:0}
.cr{flex-wrap:wrap}.cr .x{flex:1 1 150px;min-width:0}.cr .x b{font-weight:600}.cr .x code{display:block;color:var(--mu);font:12px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.seg{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;margin:6px 0 12px}.seg button{flex:1;background:transparent;border:0;border-radius:11px;padding:9px;color:var(--mu)}.seg button.on{background:var(--el2);color:var(--tx);font-weight:600}
.top{display:flex;align-items:center;gap:8px;margin:8px 0 12px}.top h2{margin:0;font-size:19px;flex:1}
.bar2{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0b0e14f2;border-top:1px solid var(--bd);display:flex;gap:8px;z-index:30}.bar2 .b{flex:1;margin:0}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
#toast.act{pointer-events:auto}#toast .undo{color:var(--ac);padding:4px 6px;margin-left:4px;border-radius:8px;background:#ffffff14;cursor:pointer}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#2b3550;color:#fff;border-radius:14px;padding:10px 18px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}#toast.on{opacity:1}
details{margin-bottom:12px}details>summary{list-style:none;cursor:pointer;background:var(--card);border-radius:18px;padding:14px;font-weight:600;display:flex;align-items:center}details>summary::after{content:"▸";margin-left:auto;color:var(--mu)}details[open]>summary{border-radius:18px 18px 0 0}details[open]>summary::after{content:"▾"}details>div{background:var(--card);border-radius:0 0 18px 18px;padding:0 14px 14px}
.lgst{font-size:13px;white-space:pre-wrap;color:var(--mu);margin-top:8px}.lgst.good{color:var(--ok)}.lgf{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd)}.lgf.on{background:rgba(47,168,120,.08)}.lgf .x{flex:1;min-width:0}.lgf pre{margin:4px 0 0;font-size:11px;white-space:pre-wrap;word-break:break-all;color:var(--mu)}

/* ===== редизайн 4.8: графит + бирюза, мягкие карточки, пилюли ===== */
.card{border:1px solid var(--bd);border-radius:18px}
.b,.tile,.c,.hb,.ib{border:1px solid transparent}
.b{border-radius:12px;font-weight:500}
.pri{background:linear-gradient(180deg,#14918a,#0f766e)!important;color:#fff!important;box-shadow:0 1px 0 #ffffff22 inset}
.ghost{border:1px solid var(--bd)!important}
.c{border-radius:999px}.c.on{background:var(--acb);color:#fff;border-color:#2dd4bf55}
.lbl,.sec{letter-spacing:.08em;font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #5eead422}
.tag{border:1px solid var(--bd)}

header{background:linear-gradient(180deg,#12302f,var(--bg) 90%)}
.logo{background:linear-gradient(135deg,#14b8a6,#0f766e);box-shadow:0 6px 18px #14b8a644}
#lv{background:var(--el);border:1px solid var(--bd);border-radius:999px;color:var(--ac)}
nav{background:#0d1016ee;border-top:1px solid var(--bd)}
nav button{border-radius:16px}nav button.on{background:var(--acb);color:#fff}
.b{transition:none}.b:active{transform:none;filter:none;background:var(--el2)}
input[type=checkbox],input[type=range]{accent-color:#14b8a6}

/* ===== настройки 5.3: ряды «название — подпись — переключатель», переключатели-пилюли, схема экрана ===== */
.scard{padding:6px 14px 6px}
.scard .sh{padding:10px 0 6px}.scard .sh h3{margin:0;font-size:16px}.scard .sh small{display:block;color:var(--mu);font-size:12.5px;line-height:1.4;margin-top:3px}
.sr{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--bd)}
.sh+.sr{border-top:0}
.sr .sx{flex:1;min-width:0}.sr .sx b{display:block;font-weight:600;font-size:14.5px}.sr .sx small{display:block;color:var(--mu);font-size:12.5px;line-height:1.4;margin-top:2px}
.sr.stack{flex-direction:column;align-items:stretch;gap:9px}
.sr input:not([type=checkbox]):not([type=range]){margin:0}.sr .num{width:92px;flex:none;text-align:center}
.sr .b{margin:0}.sr .hero{margin:0}.sr .chips{margin:0}.sr .sv{color:var(--ac);font-weight:600}
.sg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px}
.sg button{border:0;background:transparent;color:var(--mu);border-radius:9px;padding:8px 12px;font-size:13px;white-space:nowrap}
.sg button.on{background:var(--acb);color:#fff;font-weight:600}
.sg.full{width:100%}.sg.full button{flex:1;padding:9px 4px}
.sw{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.sw input[type=checkbox]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--el2);border-radius:999px;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--acb)}.sw input:checked+i::after{transform:translateX(20px)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swc{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px #ffffff22}
.swc.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px #fff}
.sd{border-top:1px solid var(--bd);margin:0}
.sd>summary{background:transparent;border-radius:0;padding:13px 0;font-size:14.5px}.sd[open]>summary{border-radius:0}
.sd>div{background:transparent;border-radius:0;padding:0 0 10px}
.sd .lbl{margin-top:10px}
.snote{padding:6px 0 10px;line-height:1.45}
.cp{margin:0 auto;width:100%;max-width:340px}
.cpf{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#1c2b3b,#0d151e 75%);border:1px solid var(--bd)}
.cpf::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff07 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 22px)}
.cpr{position:absolute;border:2px solid var(--ac);background:#5eead41c;border-radius:6px;box-shadow:0 0 0 999px #05080dbb;padding:4px 5px;overflow:hidden}
.cpr i{display:block;height:3px;border-radius:2px;background:#f5a04b;margin:0 0 4px;opacity:.9}
.cpt{position:absolute;right:8px;bottom:6px;font-size:11px;color:#ffffff55;letter-spacing:.08em;text-transform:uppercase}
.cpn{color:var(--mu);font-size:12.5px;margin-top:8px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.cgi{display:block}.cgi small{display:block;color:var(--mu);font-size:11.5px;margin-bottom:3px}.cgi input{margin:0;text-align:center;padding:10px 4px}

.hcard .hst{font-size:20px;font-weight:700;margin-bottom:2px}.hcard .hl{margin-bottom:10px}
.kp>div{background:var(--bg)}.kp .xs,.mu.xs{font-size:11px}
.wk .bar{display:flex;flex-direction:column-reverse;overflow:hidden}.wk .bar i{display:block}.wk small.tdy{color:var(--ac);font-weight:700}
.kv{display:flex;gap:8px;margin:10px 0 6px}.kv>div{flex:1;background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}.kv>div:empty{display:none}.kv b{font-size:16px}
.tips .tip{padding:8px 0;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:2px}.tips .tip:first-of-type{border:0}

/* строки списков: сжатые, действия раскрываются касанием */
.cr,.pt{cursor:pointer}
.cr .acts,.pt .acts{display:none;flex:0 0 100%;margin:2px 0 0;justify-content:flex-end;padding-top:6px;border-top:1px dashed var(--bd)}
.cr.open .acts,.pt.open .acts{display:flex}
.cr.open,.pt.open{background:#ffffff08}
.cr .acts .ib,.pt .acts .ib{width:42px;height:34px}
.cr .x b{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cr::after{content:'⋯';color:var(--mu);margin-left:auto;font-size:18px;line-height:1;padding:0 4px}
.cr.open::after{content:'▴'}
.cr{padding:9px 8px 9px 14px}.pt{padding:8px 8px 8px 14px}
.rule .rh .ib{width:34px;height:34px}

.posw{display:flex;align-items:center;gap:12px;margin-top:8px}.posg{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.posg button,.posr{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;height:36px;font-size:16px}
.posr{padding:0 14px;font-size:13px}.posg button.on,.posr.on{background:var(--acb);color:#fff;border-color:transparent}
</style></head><body>
<div id="app">
<header><div class="logo">GM</div><div><b>GM Admin Helper</b><small id="sub">помощник администратора</small></div><div id="lv"></div></header>
<main id="main"></main>
</div>
<nav id="nav"></nav>
<div id="toast"></div>
<script src="core.js"></script>
<script>
const $=s=>document.querySelector(s);
const A=window.Android||null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(t,f,c)=>{const b=el('button','b '+(c||''),t);b.onclick=()=>f(b);return b};
const ib=(t,f,c,title)=>{const b=el('button','ib '+(c||''),t);if(title)b.title=title;b.onclick=e=>{e.stopPropagation();f(b)};return b};
const chip=(t,f,on)=>{const b=el('button','c'+(on?' on':''),t);b.onclick=()=>f(b);return b};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
/* удаление: сразу, одним касанием, с кнопкой «Отменить» в уведомлении (вместо двойного нажатия) */
let utt;
function toastUndo(msg,undo){const t=$('#toast');t.textContent='';t.append(msg+'  ');const u=el('b','undo','Отменить');u.onclick=()=>{undo();t.classList.remove('on')};t.append(u);t.classList.add('on','act');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on','act'),5000)}
function two(label,f,cls){const b=el('button','ib red '+(cls||''),label);b.title='Удалить';
 b.onclick=e=>{e.stopPropagation();
  const snap=JSON.stringify({rules,reasons,cmds,ans,btns});
  f();
  toastUndo('Удалено',()=>{try{const o=JSON.parse(snap);rules=o.rules;reasons=o.reasons;cmds=o.cmds;ans=o.ans;btns=o.btns;saveModel();saveCmds();saveAns();saveBtns();render()}catch(x){toast('Не удалось отменить')}})};
 return b}
function gd(k,d){try{const v=A&&A.getData?A.getData(k):localStorage.getItem('gm_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sd(k,v){try{const s=JSON.stringify(v);if(A&&A.setData)A.setData(k,s);else localStorage.setItem('gm_'+k,s)}catch(e){}}
let cfg,rules,reasons,cmds,ans,btns;
function loadAll(){cfg=Object.assign({},DEF_CFG,gd('cfg',{}));cfg.replies=Object.assign({},DEF_CFG.replies,cfg.replies||{});
 const m=loadModel(gd,sd);rules=m.rules;reasons=m.reasons;cmds=loadCmds(gd,sd);ans=normAns(gd('answers',null));btns=normBtns(gd('btns',null));applyTheme(cfg)}
loadAll();
const saveCfg=()=>{sd('cfg',cfg);try{A&&A.cfgChanged&&A.cfgChanged()}catch(e){}};
const saveModel=()=>{sd('rules',rules);sd('reasons',reasons)};
const saveCmds=()=>sd('cmds',cmds),saveAns=()=>sd('answers',ans),saveBtns=()=>sd('btns',btns);
window.gmBk=()=>{if(tab==='s')render()};window.gmRestored=ok=>{if(ok){loadAll();ed=null;render(true)}};
const act=n=>{try{A&&A.act&&A.act(n)}catch(e){}};
let bsub='rep',tab='h',ed=null,edKind='',rcat='Все',rq='',ropen=new Set(rules.length?[rules[0].id]:[]),lvv=1,csub='c',acat='',qaCmd={};
const TABS=[['h','','Главная'],['r','','Правила'],['c','','Команды'],['s','','Настройки']];
function nav(){const n=$('#nav');n.innerHTML='';TABS.forEach(([k,i,t])=>{const b=el('button',k===tab?'on':'');b.append(t);b.onclick=()=>{tab=k;ed=null;render(true)};n.append(b)})}
/* раскрытие строк списка (команды, пункты правил, ответы, кнопки): запоминается между перерисовками */
let rowKey='';
const rowK=r=>(r.closest('.card')?.firstElementChild?.textContent||'').slice(0,12)+'|'+(r.querySelector('b,.nm')?.textContent||r.textContent).slice(0,40);
document.addEventListener('click',e=>{if(e.target.closest('button,input,textarea,select,a'))return;const r=e.target.closest('.cr,.pt');if(!r||!r.querySelector('.acts'))return;const was=r.classList.contains('open');document.querySelectorAll('.cr.open,.pt.open').forEach(x=>x.classList.remove('open'));if(!was){r.classList.add('open');rowKey=rowK(r)}else rowKey=''});
let roT;new MutationObserver(()=>{clearTimeout(roT);roT=setTimeout(()=>{if(rowKey&&!document.querySelector('.cr.open,.pt.open'))reopenRow()},0)}).observe(document.documentElement,{childList:true,subtree:true});
function reopenRow(){if(!rowKey)return;for(const r of document.querySelectorAll('.cr,.pt')){if(rowK(r)===rowKey){r.classList.add('open');return}}}
function render(top){nav();const m=$('#main'),st=m.scrollTop;m.innerHTML='';document.body.dataset.form=ed?'1':'';
 ({h:pHome,r:pRules,c:pCmds,s:pSet})[tab](m);$('#lv').textContent='Ур. '+cfg.lvl;
 const old=document.querySelector('.bar2');if(old)old.remove();if(ed&&m._bar)document.body.append(m._bar);
 m.scrollTop=top?0:st}
const field=(host,label,node,hint)=>{host.append(el('div','lbl',label),node);if(hint)host.append(el('div','mu sm',hint));return node};

  field(b,'Запрос в админ-чат, если не хватает прав',stext(cfg.reqTpl,'/a {cmd}',i=>{cfg.reqTpl=i.value.includes('{cmd}')?i.value.trim():DEF_CFG.reqTpl;i.value=cfg.reqTpl;saveCfg()}),'{cmd} — сама команда, например «/a /mute 45 30 флуд».');
  [['sp','После слежки'],['tp','После телепорта'],['spawn','После спавна'],['pun','После наказания']].forEach(([k,t])=>field(b,'Автоответ: '+t.toLowerCase(),stext(cfg.replies[k],'пусто — не отправлять',i=>{cfg.replies[k]=i.value;saveCfg()})))});
 srow(s,'Кнопки окон репорта и слежки','Название и действия меняются: одна кнопка может ответить игроку, зайти в слежку и перевернуть машину.',btn('Настроить',()=>{tab='c';csub='b';ed=null;render(true)},'pri sm'));

 /* ---- клавиатура ---- */
 const k=scard(m,'Клавиатура GM','Высота применяется при следующем открытии. Менять можно и прямо на клавиатуре кнопкой ⇕.');
 sslider(k,'Высота панели','',25,75,()=>cfg.kbh,v=>{cfg.kbh=v},'%');
 sslider(k,'Высота при наборе букв','',22,60,()=>cfg.kbt,v=>{cfg.kbt=v},'%');

 /* ---- данные ---- */
 let bi={};try{bi=JSON.parse(A.backupInfo())}catch(e){}
 const bk=scard(m,'Резервная копия','Один файл: правила, команды, ответы, кнопки окон, область чтения, настройки и журнал.');
 const r1=el('div','sr stack'),h1=el('div','hero');h1.append(btn('Сохранить в файл',()=>act('backupSave'),'pri'),btn('Загрузить из файла',()=>act('backupLoad')));r1.append(h1);bk.append(r1);
 srow(bk,'Автокопия, раз в N часов','0 — выключена. Работает, пока запущен значок.',snum(cfg.bkH||0,'0',i=>{cfg.bkH=Math.max(0,Math.min(720,+i.value||0));i.value=cfg.bkH;saveCfg()}));
 srow(bk,'Последняя копия',(bi.last?new Date(bi.last).toLocaleString('ru-RU'):'ещё не делалась')+' · '+(bi.dir?'выбранная папка':'папка приложения'));
 const r2=el('div','sr stack'),h2=el('div','hero');h2.append(btn('Копия сейчас',()=>act('backupRun'),'sm'),btn(bi.dir?'Другая папка':'Выбрать папку',()=>act('backupDir'),'sm'));if(bi.dir)h2.append(btn('Сбросить папку',()=>act('backupDirClear'),'sm ghost'));r2.append(h2);bk.append(r2);
 srow(bk,'Стандартный набор','Готовые правила, команды и ответы — текущие будут заменены.',btn('Загрузить',b=>{if(b.dataset.s){const mm=normModel(null,null);rules=mm.rules;reasons=mm.reasons;cmds=DEF_CMDS();ans=DEF_ANS();saveModel();saveCmds();saveAns();toast('Загружено');render()}else{b.dataset.s=1;b.textContent='Заменить?'}},'sm ghost'));

 /* ---- служебное ---- */
 const ab2=scard(m,'О приложении');
 let dt='';try{dt=A.diag()}catch(e){}const dp=el('pre','',dt||'Ошибок нет.');
 sfold(ab2,'Диагностика (ошибки)',b=>{const r=el('div','hero');r.append(btn('Скопировать',()=>{try{A.copy(dp.textContent);toast('Скопировано')}catch(e){}},'sm'),btn('Очистить',()=>{try{A.diagClear()}catch(e){}dp.textContent='Ошибок нет.'},'sm'));b.append(dp,r)});
 ab2.append(el('div','mu sm snote','Работает только на устройстве: интернета у приложения нет. Права: «Поверх других приложений» (значок, окна, рамка области), уведомления, запись экрана (только когда запускаешь ловец, скриншот или запись) и собственная клавиатура GM. К контактам, файлам, SMS и истории других приложений доступа нет. Новая версия ставится поверх старой.'))}
window.addEventListener('focus',()=>{if(tab==='h')updSt();else if(tab==='s'&&!ed&&readCrop()!==cropNow)render()});
setInterval(updSt,1500);
render(true);
</script></body></html>
