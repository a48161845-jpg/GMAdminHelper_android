<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GM Admin</title>
<style>
:root{--bg:#0d1016;--card:#151a23;--el:#1e2530;--el2:#2a3342;--tx:#eef1f6;--mu:#8d97a8;--bd:#252d3b;--ac:#5eead4;--acb:#0f766e;--ok:#34d399;--er:#f0616d;--wr:#f5b84b;--pk:#b4506a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;position:relative}
button{font:inherit;color:var(--tx);cursor:pointer;touch-action:manipulation}
.hid{display:none!important}.mu{color:var(--mu)}.sm{font-size:12px}
/* шапка */
#hd{display:flex;gap:6px;padding:5px 6px;background:var(--card);border-bottom:1px solid var(--bd);align-items:center;flex:none}
#nav{display:flex;flex:1;gap:3px;min-width:0}
#nav button{flex:1;min-width:0;overflow:hidden;background:transparent;color:var(--mu);border:0;border-radius:10px;padding:7px 2px;font-size:13px;white-space:nowrap;position:relative;transition:background .15s}
#nav button.on{background:var(--el2);color:var(--tx);font-weight:600;box-shadow:inset 0 -2px 0 var(--ac)}
#nav b{position:absolute;top:0;right:1px;background:var(--er);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;line-height:15px}
.hr{display:flex;gap:4px;flex:none}
.hb{min-width:36px;height:34px;border:0;border-radius:10px;background:var(--el);padding:0 9px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px}
.hb small{font-size:11px;color:var(--mu)}
.hb:active{background:var(--el2)}
@media (max-width:640px){#hd{flex-wrap:wrap;gap:4px;padding:5px 6px}.hr{order:1;margin-left:auto}#nav{order:2;flex:1 1 100%}#nav button{font-size:13px}}.hb.on{background:var(--acb)}.hb.clr{background:#3a2328}.hb.clr small{color:#e9a5ad}.hb.clr.on{background:var(--er)}
main{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}

/* кнопки */
.b{background:var(--el);border:0;border-radius:10px;padding:8px 12px;min-height:34px}
.b:active{background:var(--el2)}
.b.sm{min-height:28px;padding:4px 9px;font-size:12px}

.wr{background:#9b6a21!important;color:#fff!important;font-weight:600}.pk{background:var(--pk)!important;color:#fff!important;font-weight:600}
.ghost{background:transparent!important;border:1px solid var(--bd)!important;color:var(--mu)!important}
.c{background:var(--el);border:0;border-radius:16px;padding:6px 12px;font-size:13px;white-space:nowrap}
.c.on{background:var(--acb);color:#f2f5ff}.c.dim{opacity:.45}.c.big{font-size:16px;font-weight:700;padding:8px 18px;border-radius:12px}
.c.star{box-shadow:inset 0 0 0 1px var(--wr)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.row.nw{flex-wrap:nowrap}.row>.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}.g3 .b{padding:7px 4px;line-height:1.15;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips .c{flex:none}
.card{background:var(--card);border-radius:14px;padding:9px;margin-bottom:8px}
.lbl{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:0 0 5px}
/* плитки команд */

.tile:active{background:var(--el2)}
.tile::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--bd)}
.tile small{display:block;color:var(--mu);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.p::before{background:#d2515f}.tile.a::before{background:#5a8cd6}.tile.n::before{background:#e0a23b}.tile.s::before{background:#3fb97f}
.ctxl{font-size:12px;color:var(--mu);margin:6px 2px 0}.tile.req{border:1px dashed var(--wr)}.sec{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:10px 2px 6px}

.ctx{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ctx .fld{flex:1 1 170px}
/* репорты */
.rc{border-left:3px solid var(--er)}.rc.g{border-left-color:var(--ok)}.rc.sel{box-shadow:0 0 0 1px var(--ac)}
.rh{font-weight:600}.rh .cnt{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
.rt{margin:3px 0 0;word-break:break-word;color:#cdd3e2}
.box{background:var(--bg);border-radius:12px;padding:8px;margin:7px 0}
.cmd{display:flex;gap:6px;align-items:center;background:var(--bg);border-radius:10px;padding:6px 8px;margin:5px 0;font:12.5px ui-monospace,Consolas,monospace}.cmd span{flex:1;word-break:break-word;user-select:text}
.warn{color:var(--wr);font-size:12.5px;margin:4px 0}

.tag.mute,.tag.rmute{color:#e0a23b}.tag.jail{color:#e2915f}.tag.ban,.tag.sban{color:#e0677a}.tag.warn{color:#8fb4f0}
.qlist{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;margin-top:4px}
.qrow{display:block;text-align:left;background:var(--el);border:0;border-radius:10px;padding:8px 10px}.qrow b{display:block;font-weight:600}.qrow small{display:block;color:var(--mu);font-size:11.5px;line-height:1.25;max-height:2.5em;overflow:hidden}.qrow.sent{box-shadow:inset 0 0 0 1px var(--ok)}
.lvh{display:flex;align-items:center;gap:8px;width:100%;background:var(--card);border:0;border-radius:12px;padding:10px 12px;margin:4px 0 6px;text-align:left}

.pad{padding:2px 6px 8px}
.top2{display:flex;align-items:center;gap:8px;margin-bottom:4px}.top2 b{flex:1;font-size:15px}

.rule{background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}

.pt{display:flex;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--bd)}
.pt .no{min-width:34px;color:var(--ac);font-weight:700;font-size:13px;background:none!important}
.pt .nm{flex:1;min-width:0}.pt.open{background:#161d2d}
.ptx{padding:2px 12px 10px 54px;background:#161d2d}.ptx .rtx{margin:4px 0 6px;line-height:1.4;white-space:pre-wrap;user-select:text;color:#cdd3e2}
/* журнал */
.stat{display:flex;gap:6px;margin-bottom:8px}.stat>div{flex:1;background:var(--card);border-radius:14px;padding:8px 6px;text-align:center}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}.stat .btns{display:flex;gap:5px;justify-content:center;margin-top:5px}.stat .btns button{padding:2px 14px;min-height:28px}
.wk{display:flex;gap:5px;align-items:flex-end;height:74px;margin:2px 0 8px}
.wk>button{flex:1;background:var(--card);border:0;border-radius:10px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:4px 2px;gap:2px}

.ln{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd)}.ln:last-child{border:0}
.ln .t{color:var(--mu);font-size:12px;min-width:38px}.ln .x{flex:1;word-break:break-word}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.pt22{font-size:22px;font-weight:700;margin:2px 0}
/* окно ввода и клавиатура — заполняют всю высоту и прижаты к низу */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:5px 6px 4px}
.shtop{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex:none}.shval{flex:1;background:var(--card);border:1px solid var(--ac);border-radius:10px;padding:0 10px;min-height:36px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.shval span{overflow:hidden;text-overflow:ellipsis}.shval i{display:inline-block;width:2px;height:18px;background:var(--ac);margin-left:1px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.shlbl{color:var(--mu);font-size:11.5px;max-width:84px;line-height:1.1}
.kb{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0}
.kr{display:flex;gap:4px;flex:1;min-height:0}
.key{flex:1;min-width:0;min-height:0;background:var(--el);border:0;border-radius:8px;padding:0;font-size:clamp(12px,4.4vh,19px);touch-action:manipulation;box-shadow:0 1px 0 #0006}
.key:active{background:var(--acb)}.key.w{flex:1.5}.key.sp{flex:4.2}.key.on{background:var(--acb)}.key.lk{background:var(--ac);color:#10131a}
.key.pri{background:var(--acb)}
.nk{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1;min-height:0}.nk .key{font-size:clamp(14px,6vh,24px)}

/* ===== редизайн 4.8: графит + бирюза, мягкие карточки, пилюли ===== */
.card{border:1px solid var(--bd);border-radius:18px}
.b,.tile,.c,.hb,.ib{border:1px solid transparent}
.b{border-radius:12px;font-weight:500}
.pri{background:linear-gradient(180deg,#14918a,#0f766e)!important;color:#fff!important;box-shadow:0 1px 0 #ffffff22 inset}
.ghost{border:1px solid var(--bd)!important}
.c{border-radius:999px}.c.on{background:var(--acb);color:#fff;border-color:#2dd4bf55}
.lbl,.sec{letter-spacing:.08em;font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #5eead422}
.tag{border:1px solid var(--bd)}

#hd{background:var(--card);border-bottom:1px solid var(--bd)}
#nav button{border-radius:999px;font-weight:500}
#nav button.on{background:var(--acb);color:#fff;box-shadow:none}
.seg{border:1px solid var(--bd);border-radius:999px;padding:3px}.seg button{border-radius:999px}.seg button.on{background:var(--acb);color:#fff}
.rc{border:1px solid var(--bd);border-left:4px solid var(--er);border-radius:16px;padding:11px 12px}
.rc.g{border-left-color:var(--ok);opacity:.78}.rc.sel{border-color:var(--ac);box-shadow:0 0 0 2px #5eead422}
.rh{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rh .cnt{background:var(--el);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--mu);margin:0}
.rt{font-size:14px;line-height:1.35;color:#d7dce7;margin-top:5px}
.tile{border-radius:14px;background:var(--el)}
.tile::before{width:4px;top:8px;bottom:8px}
.seg.grow{margin-bottom:0;flex:1}.seg button{padding:6px 4px;font-size:12px}.b.sm{white-space:nowrap}
.pend{background:#3b3014;border-top:1px solid #f5b84b33}
.banner{background:var(--acb)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.grid4 .b{margin:0;padding:9px 4px;font-size:13px}
.chipsx{display:flex;overflow-x:auto;gap:6px;padding:6px 0;scrollbar-width:none}.chipsx::-webkit-scrollbar{display:none}.chipsx .c{flex:none}
.ws{margin-top:8px;border-top:1px solid var(--bd)}.wsec{padding:8px 0 2px}.wsec+.wsec{border-top:1px dashed var(--bd)}
.wl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}.wrow.nw{flex-wrap:nowrap}.wrow .fld{flex:1 1 150px;min-width:130px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}.grid3 .b,.grid4 .b{margin:0;min-height:40px;padding:8px 4px;font-size:13px;white-space:normal;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.rc{padding:10px 12px}.rc .rh{font-size:14.5px}.rc .rt{font-size:13.5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 6px}
.chipsx{display:flex;overflow-x:auto;gap:6px;padding:2px 0 8px;scrollbar-width:none}.chipsx::-webkit-scrollbar{display:none}.chipsx .c{flex:none;margin:0}

/* ===== 5.4: оформление ===== */
.rh .av{width:26px;height:26px;border-radius:50%;background:var(--el2);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.rh .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rc .rt{background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:7px;border:1px solid var(--bd)}
.ws{border-top:0;margin-top:6px}.wsec{background:#0d1016aa;border:1px solid var(--bd);border-radius:12px;padding:8px 9px;margin-top:6px}.wsec+.wsec{border-top:1px solid var(--bd)}

</style></head><body>
<div id="app">
<header id="hd"><div id="nav"></div><div class="hr">
 <button class="hb" id="bH" title="Высота клавиатуры">⇕</button>
 <button class="hb clr" id="bClr" title="Стереть написанный текст в поле чата">🧹</button>
 <button class="hb" id="bAuto" title="Отправлять сразу">⏎</button>
 <button class="hb" id="bSw" title="Сменить клавиатуру">🌐</button></div></header>
<div id="pend" class="pend hid"><span id="pt"></span><button class="b sm" id="pc">Отменить</button></div>

<div id="sheet" class="sheet hid"></div>
</div>
<script src="core.js"></script>
<script>
const $=s=>document.querySelector(s);
const A=window.Android||null;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(t,f,c)=>{const b=el('button','b '+(c||''),t);b.onclick=()=>f(b);return b};
const chip=(t,f,on,c)=>{const b=el('button','c'+(on?' on':'')+(c?' '+c:''),t);b.onclick=()=>f(b);return b};
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>ymd(new Date());
const hhmm=()=>new Date().toTimeString().slice(0,5);
function flash(b,m){if(!b)return;const n=b.firstChild&&b.firstChild.nodeType===3?b.firstChild:null;if(!n){b.textContent=m||'✓';return}if(b.dataset.o===undefined)b.dataset.o=n.nodeValue;n.nodeValue=m||'✓';clearTimeout(b._t);b._t=setTimeout(()=>{n.nodeValue=b.dataset.o;delete b.dataset.o},1200)}
function cp(t){try{if(A&&A.copy)A.copy(t);else navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}}
/* ---------- данные ---------- */
function gd(k,d){try{const v=A&&A.getData?A.getData(k):localStorage.getItem('gm_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sd(k,v){try{const s=JSON.stringify(v);if(A&&A.setData)A.setData(k,s);else localStorage.setItem('gm_'+k,s)}catch(e){}}
let cfg=DEF_CFG,rules=[],reasons=[],cmds=[],ans=[],jr=[],btns=DEF_BTNS();
function loadData(){cfg=Object.assign({},DEF_CFG,gd('cfg',{}));cfg.replies=Object.assign({},DEF_CFG.replies,cfg.replies||{});
 const m=loadModel(gd,sd);rules=m.rules;reasons=m.reasons;cmds=loadCmds(gd,sd);ans=normAns(gd('answers',null));btns=normBtns(gd('btns',null));applyTheme(cfg);
 $('#bAuto').classList.toggle('on',!!cfg.auto)}
function jLoad(){try{jr=JSON.parse(A&&A.jList?A.jList():localStorage.getItem('gm_jr')||'[]')||[]}catch(e){jr=[]}}
/* запись журнала не тормозит отправку: в память сразу, на диск — следом */
function J(k,l,key,win){const now=Date.now();if(key&&jr.some(x=>x.key===key&&now-(x.ts||0)<(win||600000)))return;   /* тот же репорт / то же наказание уже посчитаны */
 const e={id:now+''+Math.floor(Math.random()*900+100),d:today(),t:hhmm(),k,l};if(key){e.key=key;e.ts=now}jr.push(e);
 setTimeout(()=>{try{if(key&&A&&A.jAddK)A.jAddK(e.id,k,l,key,win||600000);else if(A&&A.jAddId)A.jAddId(e.id,k,l);else if(A&&A.jAdd)A.jAdd(k,l);else localStorage.setItem('gm_jr',JSON.stringify(jr))}catch(x){}},0);nav();if(tab==='j')render()}
function JD(id){jr=jr.filter(x=>String(x.id)!==String(id));setTimeout(()=>{try{if(A&&A.jDel)A.jDel(String(id));else localStorage.setItem('gm_jr',JSON.stringify(jr))}catch(x){}},0);render()}
/* ---------- состояние ---------- */
let tab='r',rsub='a',reports=[],reqs=[],cur=-1,ctx={rep:'',tgt:'',nick:'',name:'',msg:''},off=false;
let BU=null,PR=null,rcat='Все',rq='',rexp='',ropen=new Set(),ac='Общее',jd=today(),jf='all',jtx='',cq='',lvOpen=null;
const lvl=()=>+cfg.lvl||1;
/* цель: ID (из репорта или введённый), либо ник — одно поле «ID или ник» */
const tid=()=>ctx.nick?'':(ctx.tgt||(ctx.noRep?'':ctx.rep)),tnick=()=>ctx.nick||(tid()&&tid()===ctx.rep?ctx.name:''),tany=()=>tid()||ctx.nick;
const rid=()=>ctx.rep||tid();
