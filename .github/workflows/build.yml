name: Build APK
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      # Android SDK уже установлен на ubuntu-latest (ANDROID_HOME).
      # Шаг android-actions/setup-android падал на "Failed to find package 'tools'",
      # поэтому он убран: только принимаем лицензии и докачиваем нужные пакеты.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Download Tesseract models (rus, eng)
        run: |
          mkdir -p app/src/main/assets/tessdata
          for l in rus eng; do
            curl -fsSL --retry 3 -o app/src/main/assets/tessdata/$l.traineddata \
              https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done
          ls -la app/src/main/assets/tessdata

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GM-Admin-Helper-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
