name: Build APK

on:
push:
branches:
- main
- master
tags:
- "v*"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Prepare Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: |
        platform-tools
        platforms;android-34
        build-tools;34.0.0

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.7"

  - name: Download Tesseract models
    run: |
      mkdir -p app/src/main/assets/tessdata

      for l in rus eng; do
        echo "Downloading $l..."

        curl -fL \
          --retry 8 \
          --retry-delay 5 \
          --retry-all-errors \
          --connect-timeout 30 \
          --max-time 300 \
          -o "app/src/main/assets/tessdata/$l.traineddata" \
          "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$l.traineddata"

        test -s "app/src/main/assets/tessdata/$l.traineddata"
      done

      ls -lh app/src/main/assets/tessdata

  - name: Build debug APK
    run: gradle assembleDebug --no-daemon --stacktrace

  - name: Verify APK
    run: |
      APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
      if [ -z "$APK" ]; then
        echo "APK not found!"
        exit 1
      fi
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: GM-Admin-Helper-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    uses: softprops/action-gh-release@v2
    with:
      files: app/build/outputs/apk/debug/*.apk
