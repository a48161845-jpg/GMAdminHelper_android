name: Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Tesseract models (Russian and English)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata

          for language in rus eng; do
            file="app/src/main/assets/tessdata/${language}.traineddata"
            url="https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${language}.traineddata"

            echo "Downloading ${language}.traineddata"
            curl --fail --location               --retry 8               --retry-delay 5               --retry-all-errors               --connect-timeout 30               --max-time 300               --output "$file"               "$url"

            test -s "$file"
            echo "Downloaded ${file}"
          done

          ls -lh app/src/main/assets/tessdata

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "No debug APK was generated."
            exit 1
          fi
          echo "APK generated: $apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GM-Admin-Helper-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
